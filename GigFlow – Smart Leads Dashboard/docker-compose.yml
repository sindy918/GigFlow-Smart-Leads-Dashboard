version: '3.8'

services:
  # MongoDB Service
  mongodb:
    image: mongo:latest
    container_name: gigflow-db
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db

  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gigflow-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/gigflow
      - JWT_SECRET=gigflow_smart_leads_dashboard_secret_key_2026
      - JWT_EXPIRE=24h
      - NODE_ENV=production
    depends_on:
      - mongodb

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: gigflow-frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - VITE_API_URL=http://localhost:5000/api
    depends_on:
      - backend

volumes:
  mongo-data:
    driver: local
